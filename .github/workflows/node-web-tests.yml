name: Node web practice checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check demo-web/server.mjs
          node --check demo-web/store.mjs
          node --check demo-web/public/app.js
      - name: Node built-in tests
        working-directory: demo-web
        run: npm test
